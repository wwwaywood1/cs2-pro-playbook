# HLTV planning settings (playbook/hltv.py). Team ids are from hltv.org/team/<id>/<slug>.

[tier1]
# An event is tier-1 when its name contains one of `include` and none of `exclude`.
include = [
  "Major", "IEM ", "BLAST Open", "BLAST Premier", "BLAST Bounty", "BLAST Rivals",
  "ESL Pro League", "PGL ", "Esports World Cup", "StarLadder StarSeries",
  "FISSURE Playground", "Thunderpick World Championship", "CS Asia Championships",
]
exclude = ["Qualifier", "Showmatch", "Academy", "Digital Crusade", "CCT ", "Challenger", "Play-In Qualifier"]

[download]
since = "2026-01-01"
delay_seconds = 20

