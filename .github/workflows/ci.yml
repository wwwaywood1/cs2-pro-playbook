name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['delegation/**', 'docs/**', '**/*.md', 'validation/**']
  pull_request:
    paths-ignore: ['delegation/**', 'docs/**', '**/*.md', 'validation/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      # Some tests import web/src/*.ts through Node's type stripping (Node >= 22.18).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Pillow is needed by tests/test_map_backgrounds.py until it joins the dev extra.
      - run: pip install -e ".[dev]" pillow
      - run: pytest -q

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            web/e2e/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache pinned radar assets
        uses: actions/cache@v4
        with:
          path: ~/.awpy
          key: awpy-radars-${{ runner.os }}-2000933
      - name: Install asset and browser tooling
        run: pip install "awpy>=3.1,<4" -r web/e2e/requirements.txt
      - name: Sync committed sample data and radars
        run: python scripts/sync_web_data.py --samples
      - run: npm ci
        working-directory: web
      - name: Type check, unit tests and build
        run: npm run typecheck && npm test && npm run build
        working-directory: web
      - name: Install Chromium headless shell
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Browser smoke (sample data, desktop)
        run: |
          mkdir -p smoke-shots
          python3 -m http.server 4173 --bind 127.0.0.1 --directory web/dist > smoke-shots/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 50); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 0.1; done
          python3 web/e2e/smoke.py http://127.0.0.1:4173 --samples --shots smoke-shots
      - name: Upload smoke screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-shots/
          if-no-files-found: ignore
          retention-days: 7
